name: Extract & Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP Project
        run: |
          echo "Cari file ZIP di repo..."
          ls -lh
          
          # Cari zip apapun di root
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Ditemukan ZIP: $ZIP_FILE"
            echo "Extract..."
            unzip -o "$ZIP_FILE" -d .
            # Hapus zip setelah extract biar tidak bingung
            rm "$ZIP_FILE"
            ls -lh
          else
            echo "Tidak ada file ZIP, lanjut build normal"
          fi

      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            # kalau zip di dalam folder, cari gradlew
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              echo "Found gradlew at $GRADLEW_PATH"
              chmod +x $GRADLEW_PATH
              cd $(dirname $GRADLEW_PATH)/..
            else
              echo "gradlew tidak ditemukan, bikin wrapper baru"
              gradle wrapper --gradle-version 8.7
              chmod +x gradlew
            fi
          fi

      - name: Build APK
        run: |
          # Cari folder yang ada gradlew
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            find . -name "gradlew" -exec chmod +x {} \;
            GRADLEW=$(find . -name "gradlew" | head -n 1)
            echo "Build pakai $GRADLEW"
            $GRADLEW assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Sholat-TV
          path: |
            **/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
