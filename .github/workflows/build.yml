name: Build APK from ZIP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || find . -name "*.zip" | head -n1)
          if [ -f "$ZIP" ]; then
            echo "Extract $ZIP"
            unzip -o "$ZIP" -d .
          fi
          ls -R | head -n 100

      - name: Fix Project Structure
        run: |
          # kalau hasil extract bikin folder double, rapikan
          if [ ! -f "settings.gradle" ]; then
            FOUND=$(find . -name "settings.gradle" | head -n1)
            if [ -n "$FOUND" ]; then
              echo "Found settings.gradle at $FOUND"
              cp -r $(dirname $FOUND)/* ./
            fi
          fi
          # pastikan ada settings.gradle
          if [ ! -f "settings.gradle" ]; then
            echo "Creating settings.gradle"
            cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          fi
          cat settings.gradle
          cat app/build.gradle || cat build.gradle || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle Wrapper
        run: |
          # bikin wrapper jika tidak ada gradlew
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info --no-daemon
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: "**/*.apk"
