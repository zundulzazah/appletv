name: Build APK from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP if exists
        run: |
          ls -la
          # cari file zip apapun
          ZIPFILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIPFILE" ]; then
            ZIPFILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1 || true)
          fi
          
          if [ -n "$ZIPFILE" ] && [ -f "$ZIPFILE" ]; then
            echo "Found ZIP: $ZIPFILE"
            sudo apt-get update -qq && sudo apt-get install -y unzip -qq
            unzip -o "$ZIPFILE" -d ./extracted
            # pindahkan isi extracted ke root jika ada folder app di dalamnya
            if [ -d "./extracted/app" ]; then
              cp -r ./extracted/* ./
            else
              # cari folder app di dalam extracted
              APP_DIR=$(find ./extracted -type d -name "app" | head -n 1)
              if [ -n "$APP_DIR" ]; then
                echo "Found app at $APP_DIR"
                cp -r $(dirname $APP_DIR)/* ./
              else
                cp -r ./extracted/* ./
              fi
            fi
            rm -rf ./extracted
          else
            echo "No ZIP found, using existing files"
          fi
          ls -la
          ls -la app/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-TV-Launcher
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
